version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

  settings:
    errcheck:
      exclude-functions:
        - encoding/json.Unmarshal
        - (net/http.ResponseWriter).Write
        - (*encoding/json.Encoder).Encode

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/flagmanagment

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - source: "\.LogAction\("
      linters:
        - errcheck
