name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'backend/go.mod'
          cache-dependency-path: backend/go.sum
      - name: Download Go dependencies
        run: cd backend && go mod download
      - name: Go vet
        run: cd backend && go vet ./...
      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.12.2
      - name: golangci-lint
        run: cd backend && golangci-lint run --timeout=5m ./...

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npx eslint src/ --ext .ts,.tsx
      - run: cd frontend && npx prettier --check "src/**/*.{ts,tsx,css}"

  test-backend:
    runs-on: ubuntu-latest
    needs: lint-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'backend/go.mod'
          cache-dependency-path: backend/go.sum
      - name: Download Go dependencies
        run: cd backend && go mod download
      - name: Run tests with coverage
        run: cd backend && go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Check coverage summary
        run: |
          cd backend
          go tool cover -func=coverage.out | grep total

  test-frontend:
    runs-on: ubuntu-latest
    needs: lint-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - name: Run tests
        run: cd frontend && npx vitest run

  build-verify:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'backend/go.mod'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Build backend binary
        run: |
          cd backend
          CGO_ENABLED=0 GOOS=linux go build -ldflags="-s -w" -o server ./cmd/server
      - name: Build frontend assets
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Build backend image
        run: docker build --progress=plain -t flagmanagment/backend:ci -f backend/Dockerfile backend/
      - name: Build frontend image
        run: docker build --progress=plain -t flagmanagment/frontend:ci -f frontend/Dockerfile frontend/
