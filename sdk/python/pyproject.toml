[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flagmanagment-sdk"
version = "1.0.0"
description = "FlagManagment SDK for Python applications"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openfeature-sdk>=0.6.0",
    "sseclient-py>=1.8.0",
    "requests>=2.31.0"
]
