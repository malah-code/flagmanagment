apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flagmanagment.fullname" . }}-secrets
  labels:
    {{- include "flagmanagment.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secrets.jwtSecret | default (randAlphaNum 32) | quote }}
  ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | default (randAlphaNum 32) | quote }}
  HASHING_SALT: {{ .Values.secrets.hashingSalt | default (randAlphaNum 16) | quote }}
  {{- if .Values.postgresql.enabled }}
  DB_PASSWORD: {{ .Values.postgresql.auth.password | default "postgres" | quote }}
  {{- else if .Values.externalDatabase.password }}
  DB_PASSWORD: {{ .Values.externalDatabase.password | quote }}
  {{- end }}
  {{- if and (not .Values.redis.enabled) .Values.externalRedis.password }}
  REDIS_PASSWORD: {{ .Values.externalRedis.password | quote }}
  {{- end }}

