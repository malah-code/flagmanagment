{{- if .Values.edgeProxy.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flagmanagment.fullname" . }}-edge-proxy
  labels:
    {{- include "flagmanagment.labels" . | nindent 4 }}
    app.kubernetes.io/component: edge-proxy
spec:
  type: {{ .Values.edgeProxy.service.type }}
  ports:
    - port: {{ .Values.edgeProxy.service.grpcPort }}
      targetPort: grpc
      protocol: TCP
      name: grpc
    - port: {{ .Values.edgeProxy.service.healthPort }}
      targetPort: health
      protocol: TCP
      name: health
  selector:
    {{- include "flagmanagment.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: edge-proxy
{{- end }}
