{{- if and .Values.edgeProxy.enabled .Values.edgeProxy.autoscaling.enabled -}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "flagmanagment.fullname" . }}-edge-proxy
  labels:
    {{- include "flagmanagment.labels" . | nindent 4 }}
    app.kubernetes.io/component: edge-proxy
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "flagmanagment.fullname" . }}-edge-proxy
  minReplicas: {{ .Values.edgeProxy.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.edgeProxy.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.edgeProxy.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.edgeProxy.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
{{- end }}
