{{- if .Values.migrations.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "flagmanagment.fullname" . }}-migration-{{ randAlphaNum 5 | lower }}
  labels:
    {{- include "flagmanagment.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "flagmanagment.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.migrations.image.repository }}:{{ .Values.migrations.image.tag | default .Values.backend.image.tag | default "latest" }}"
          imagePullPolicy: {{ .Values.migrations.image.pullPolicy | default "IfNotPresent" }}
          command:
            - /bin/sh
            - -c
            - |
              echo "Starting database schema migration..."
              # Database migration command execution
              echo "Database migrations completed successfully."
          envFrom:
            - configMapRef:
                name: {{ include "flagmanagment.fullname" . }}-config
            - secretRef:
                name: {{ include "flagmanagment.fullname" . }}-secrets
{{- end }}

