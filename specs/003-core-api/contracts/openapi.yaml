openapi: 3.0.3
info:
  title: FlagManagment Core API
  version: 1.0.0
  description: Management and SDK endpoints for FlagManagment.
paths:
  /api/v1/projects:
    post:
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Project created
  /api/v1/projects/{projectId}/environments:
    post:
      summary: Create an environment
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Environment created with API key
  /api/v1/projects/{projectId}/flags:
    post:
      summary: Create a feature flag
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                type:
                  type: string
                  enum: [boolean, string, number, json]
      responses:
        '201':
          description: Flag created
  /api/v1/environments/{envId}/flags/{flagId}/state:
    put:
      summary: Update flag state for an environment
      parameters:
        - name: envId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: flagId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                state:
                  type: boolean
                targetingRules:
                  type: array
                  items:
                    type: object
                remoteConfig:
                  type: object
      responses:
        '200':
          description: State updated
  /api/v1/evaluate/flags:
    get:
      summary: Evaluate all flags for an environment (SDK endpoint)
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Flag evaluation payload
        '304':
          description: Not Modified
components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
